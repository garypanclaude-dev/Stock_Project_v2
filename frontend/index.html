<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Insights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

<!-- ═══ HEADER ═══════════════════════════════════════════════════════════════ -->
<header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
  <div class="max-w-[1440px] mx-auto px-4 py-3 flex items-center gap-3">
    <button data-action="toggle-sidebar" title="Watchlist"
      class="p-1.5 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="flex items-center gap-2 mr-1 shrink-0">
      <svg class="w-6 h-6 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
      </svg>
      <span class="text-base font-bold tracking-tight hidden sm:inline">StockInsights</span>
    </div>

    <input id="ticker-input" type="text" value="AAPL" maxlength="10" spellcheck="false"
      placeholder="e.g. AAPL"
      class="w-24 bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5
             text-white font-mono text-sm focus:outline-none focus:ring-2
             focus:ring-blue-500 focus:border-transparent transition" />

    <button data-action="analyze"
      class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-3 py-1.5
             rounded-lg font-semibold text-sm transition-colors shrink-0">
      分析 ↵
    </button>

    <button data-action="add-to-watchlist" title="加入自選"
      class="p-1.5 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
      <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <div class="flex-1"></div>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <span class="text-xs text-slate-400">LIVE</span>
      <div class="relative" data-action="toggle-mock">
        <div id="toggle-track" class="w-10 h-5 rounded-full transition-colors duration-200 bg-amber-500"></div>
        <div id="toggle-dot" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 translate-x-5"></div>
      </div>
      <span class="text-xs text-slate-400">MOCK</span>
    </label>
    <span id="mock-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30">MOCK</span>
  </div>
</header>

<!-- ═══ TOP TABS（頂層 view 切換器） ═══════════════════════════════════════════ -->
<nav class="bg-slate-850 border-b border-slate-700" style="background:#0d1520">
  <div class="max-w-[1440px] mx-auto px-4">
    <div id="top-tabs" class="flex gap-1 overflow-x-auto no-scrollbar">
      <button data-view="stock"             class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">個股分析</button>
      <button data-view="screener"          class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">🏆 潛力選股</button>
      <button data-view="strategy-backtest" class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">策略回測</button>
      <button data-view="sector-heatmap"    class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">產業熱度</button>
      <button data-view="etf-compare"       class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">ETF 比較</button>
      <button data-view="dividend-dca"      class="px-4 py-2.5 text-sm font-medium whitespace-nowrap rounded-t-lg transition-colors text-slate-400 hover:text-slate-200">高股息定期定額</button>
    </div>
  </div>
</nav>

<!-- ═══ BODY (sidebar + main) ═════════════════════════════════════════════════ -->
<div class="flex flex-1 overflow-hidden">

  <aside id="wl-sidebar" class="wl-sidebar shrink-0 bg-slate-850 border-r border-slate-700 flex flex-col overflow-hidden" style="background:#0d1520">
    <div class="px-3 py-3 border-b border-slate-700 flex items-center justify-between">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">自選股清單</h2>
      <button data-action="wl-refresh" title="重新整理" class="p-1 rounded hover:bg-slate-700 transition">
        <svg id="wl-refresh-icon" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
        </svg>
      </button>
    </div>

    <div id="wl-list" class="flex-1 overflow-y-auto"></div>

    <div class="px-3 py-2 border-t border-slate-700">
      <div class="flex gap-1.5">
        <input id="wl-add-input" type="text" placeholder="新增代號…" spellcheck="false" maxlength="10"
          class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1
                 text-xs text-white font-mono uppercase focus:outline-none focus:ring-1 focus:ring-blue-500" />
        <button data-action="wl-add"
          class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded-lg text-xs font-semibold transition-colors">+</button>
      </div>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-screen-xl mx-auto w-full px-6 py-6">
      <!-- TabController 會在這裡動態建立每個 view 的 panel -->
      <div id="view-container"></div>
    </div>
  </main>
</div>

<script type="module" src="src/main.js"></script>

</body>
</html>
