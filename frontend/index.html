<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Insights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card-hover { transition: transform .15s, box-shadow .15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 20px #0006; }
    #ticker-input { text-transform: uppercase; letter-spacing: .1em; }
    #ticker-input::placeholder { text-transform: none; letter-spacing: normal; }
    .period-btn { transition: all .15s; }
    .period-btn.active { background: #3b82f6; color: white; }
    .indicator-chip { transition: all .15s; cursor: pointer; user-select: none; }
    .indicator-chip.active { border-color: #3b82f6; background: rgba(59,130,246,.15); color: #93c5fd; }
    .fund-label { color: #94a3b8; font-size: 0.75rem; }
    .fund-value { color: #e2e8f0; font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .quarter-bar { transition: width .4s ease; }

    /* Watchlist sidebar */
    .wl-sidebar { width: 260px; transition: margin-left .25s ease; }
    .wl-sidebar.collapsed { margin-left: -260px; }
    .wl-row { transition: background .1s; }
    .wl-row:hover { background: rgba(51,65,85,.5); }
    .wl-row.active { background: rgba(59,130,246,.12); border-left: 2px solid #3b82f6; }
    .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15,23,42,.6); border-radius: 1rem; z-index: 10; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

<!-- ═══ HEADER ═══════════════════════════════════════════════════════════════ -->
<header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
  <div class="max-w-[1440px] mx-auto px-4 py-3 flex items-center gap-3">
    <!-- Watchlist toggle -->
    <button onclick="toggleSidebar()" title="Watchlist"
      class="p-1.5 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="flex items-center gap-2 mr-1 shrink-0">
      <svg class="w-6 h-6 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
      </svg>
      <span class="text-base font-bold tracking-tight hidden sm:inline">StockInsights</span>
    </div>

    <input id="ticker-input" type="text" value="AAPL" maxlength="10" spellcheck="false"
      placeholder="e.g. AAPL"
      class="w-24 bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5
             text-white font-mono text-sm focus:outline-none focus:ring-2
             focus:ring-blue-500 focus:border-transparent transition"
      onkeydown="if(event.key==='Enter') analyze()" />

    <button onclick="analyze()"
      class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-3 py-1.5
             rounded-lg font-semibold text-sm transition-colors shrink-0">
      分析 ↵
    </button>

    <!-- Add to watchlist -->
    <button onclick="addCurrentToWatchlist()" title="加入自選"
      class="p-1.5 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
      <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <div class="flex-1"></div>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <span class="text-xs text-slate-400">LIVE</span>
      <div class="relative" onclick="toggleMock()">
        <div id="toggle-track" class="w-10 h-5 rounded-full transition-colors duration-200 bg-amber-500"></div>
        <div id="toggle-dot" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 translate-x-5"></div>
      </div>
      <span class="text-xs text-slate-400">MOCK</span>
    </label>
    <span id="mock-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30">MOCK</span>
  </div>
</header>

<!-- ═══ BODY (sidebar + main) ═════════════════════════════════════════════════ -->
<div class="flex flex-1 overflow-hidden">

  <!-- ── WATCHLIST SIDEBAR ─────────────────────────────────────────────────── -->
  <aside id="wl-sidebar" class="wl-sidebar shrink-0 bg-slate-850 border-r border-slate-700 flex flex-col overflow-hidden" style="background:#0d1520">
    <div class="px-3 py-3 border-b border-slate-700 flex items-center justify-between">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">自選股清單</h2>
      <button onclick="refreshWatchlist()" title="重新整理" class="p-1 rounded hover:bg-slate-700 transition">
        <svg id="wl-refresh-icon" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
        </svg>
      </button>
    </div>

    <div id="wl-list" class="flex-1 overflow-y-auto">
      <!-- filled by JS -->
    </div>

    <!-- Quick add -->
    <div class="px-3 py-2 border-t border-slate-700">
      <div class="flex gap-1.5">
        <input id="wl-add-input" type="text" placeholder="新增代號…" spellcheck="false" maxlength="10"
          class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1
                 text-xs text-white font-mono uppercase focus:outline-none focus:ring-1 focus:ring-blue-500"
          onkeydown="if(event.key==='Enter') addFromInput()" />
        <button onclick="addFromInput()"
          class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded-lg text-xs font-semibold transition-colors">+</button>
      </div>
    </div>
  </aside>

  <!-- ── MAIN CONTENT ──────────────────────────────────────────────────────── -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-screen-xl mx-auto w-full px-6 py-6">

      <!-- Loading -->
      <div id="state-loading" class="hidden flex-col items-center justify-center h-72 gap-4">
        <div class="spin w-10 h-10 rounded-full border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-slate-400 text-sm">Fetching market data…</p>
      </div>

      <!-- Error -->
      <div id="state-error" class="hidden bg-red-950/40 border border-red-500/30 rounded-2xl p-8 text-center mt-10">
        <p class="text-4xl mb-3">⚠️</p>
        <p id="error-msg" class="text-red-400 font-medium"></p>
      </div>

      <!-- Dashboard -->
      <div id="dashboard" class="space-y-5">

        <!-- ROW 0: Score card -->
        <div id="score-card" class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
          <div class="flex flex-col lg:flex-row gap-6">
            <!-- Donut chart -->
            <div class="flex flex-col items-center justify-center shrink-0" style="width:140px">
              <div style="position:relative; width:120px; height:120px">
                <canvas id="score-donut"></canvas>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                  <span id="score-number" class="text-3xl font-extrabold tabular-nums">–</span>
                  <span id="score-label" class="text-xs font-semibold text-slate-400">–</span>
                </div>
              </div>
            </div>
            <!-- Sub-scores + commentary -->
            <div class="flex-1 min-w-0">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">綜合投資評分</h2>
              <div id="sub-scores" class="space-y-2.5 mb-4">
                <!-- filled by JS -->
              </div>
              <div id="commentary-box" class="bg-slate-900/50 rounded-xl p-3 border border-slate-700">
                <p id="commentary-text" class="text-sm text-slate-300 leading-relaxed">–</p>
              </div>
              <p class="text-xs text-slate-600 mt-2">以上僅為分析參考，不構成投資建議，投資決策請自行評估風險。</p>
            </div>
          </div>
        </div>

        <!-- ROW 1: Price + Valuation -->
        <div class="grid grid-cols-5 gap-5">
          <div id="price-card" class="col-span-5 lg:col-span-3 bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span id="h-symbol" class="text-2xl font-extrabold tracking-tight">AAPL</span>
                  <span id="h-currency" class="text-xs bg-slate-700 text-slate-400 px-2 py-0.5 rounded-md font-mono">USD</span>
                  <span id="h-sector" class="text-xs bg-slate-700 text-slate-400 px-2 py-0.5 rounded-md"></span>
                  <span id="h-mock-tag" class="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md hidden">MOCK</span>
                </div>
                <div class="flex flex-wrap items-baseline gap-3">
                  <span id="h-price" class="text-4xl font-extrabold tabular-nums">–</span>
                  <span id="h-change" class="text-lg font-semibold text-slate-500">–</span>
                </div>
                <div class="flex gap-4 mt-2 text-xs text-slate-500">
                  <span>52W High: <strong id="h-52h" class="text-slate-300">–</strong></span>
                  <span>52W Low: <strong id="h-52l" class="text-slate-300">–</strong></span>
                  <span>Beta: <strong id="h-beta" class="text-slate-300">–</strong></span>
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-xs text-slate-500 mb-0.5">Market Cap</div>
                <div id="h-mcap" class="text-sm font-bold text-slate-200">–</div>
                <div class="text-xs text-slate-500 mt-2">Prev. Close</div>
                <div id="h-prev" class="text-sm font-medium text-slate-300">–</div>
              </div>
            </div>
          </div>
          <div class="col-span-5 lg:col-span-2 bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">估值指標</h2>
            <div class="grid grid-cols-3 gap-x-4 gap-y-3" id="valuation-grid"></div>
          </div>
        </div>

        <!-- ROW 2: Charts + Right column -->
        <div class="grid grid-cols-5 gap-5">
          <div class="col-span-5 lg:col-span-3 flex flex-col gap-5">

            <!-- Period + overlay controls -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 fade-in">
              <div class="flex flex-wrap items-center gap-3">
                <span class="text-xs text-slate-500 font-semibold uppercase mr-1">Period</span>
                <div id="period-btns" class="flex gap-1.5">
                  <button class="period-btn text-xs px-3 py-1 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600" data-p="1M">1M</button>
                  <button class="period-btn text-xs px-3 py-1 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 active" data-p="3M">3M</button>
                  <button class="period-btn text-xs px-3 py-1 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600" data-p="6M">6M</button>
                  <button class="period-btn text-xs px-3 py-1 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600" data-p="1Y">1Y</button>
                  <button class="period-btn text-xs px-3 py-1 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600" data-p="YTD">YTD</button>
                </div>
                <div class="w-px h-5 bg-slate-600 mx-1"></div>
                <span class="text-xs text-slate-500 font-semibold uppercase mr-1">Overlay</span>
                <div id="overlay-chips" class="flex flex-wrap gap-1.5">
                  <span class="indicator-chip text-xs px-2.5 py-1 rounded-full border border-slate-600 text-slate-400 active" data-key="ma5">MA5</span>
                  <span class="indicator-chip text-xs px-2.5 py-1 rounded-full border border-slate-600 text-slate-400 active" data-key="ma10">MA10</span>
                  <span class="indicator-chip text-xs px-2.5 py-1 rounded-full border border-slate-600 text-slate-400 active" data-key="ma20">MA20</span>
                  <span class="indicator-chip text-xs px-2.5 py-1 rounded-full border border-slate-600 text-slate-400" data-key="ma60">MA60</span>
                  <span class="indicator-chip text-xs px-2.5 py-1 rounded-full border border-slate-600 text-slate-400" data-key="bb">BB</span>
                </div>
              </div>
            </div>

            <!-- Candlestick chart (with chart-loading overlay target) -->
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in relative" id="chart-wrapper">
              <div id="chart-loading" class="chart-loading hidden">
                <div class="spin w-6 h-6 rounded-full border-2 border-blue-500 border-t-transparent"></div>
              </div>
              <div style="position:relative; height:280px"><canvas id="price-chart"></canvas></div>
              <div style="position:relative; height:48px; margin-top:6px"><canvas id="volume-chart"></canvas></div>
            </div>

            <!-- RSI -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">RSI (14)</h2>
              <div style="position:relative; height:120px"><canvas id="rsi-chart"></canvas></div>
            </div>

            <!-- MACD -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">MACD (12, 26, 9)</h2>
              <div style="position:relative; height:140px"><canvas id="macd-chart"></canvas></div>
            </div>
          </div>

          <!-- RIGHT column -->
          <div class="col-span-5 lg:col-span-2 flex flex-col gap-5">
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">獲利能力</h2>
              <div id="profit-grid" class="grid grid-cols-2 gap-x-4 gap-y-3"></div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">股利資訊</h2>
              <div id="dividend-grid" class="grid grid-cols-2 gap-x-4 gap-y-3"></div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">季度營收趨勢</h2>
              <div id="quarterly-bars" class="space-y-2.5"></div>
            </div>
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 fade-in">
              <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4">市場情緒</h2>
              <div id="sentiment-bars" class="space-y-3"></div>
              <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between text-xs text-slate-500">
                <span>催化劑篩選後</span><span id="catalyst-count">0 則</span>
              </div>
            </div>
            <div class="flex flex-col gap-3 overflow-y-auto" style="max-height:520px; padding-right:2px">
              <div id="catalyst-cards"></div>
            </div>
          </div>
        </div>

      </div><!-- /dashboard -->
    </div>
  </main>
</div>

<!-- ═══ SCRIPT ════════════════════════════════════════════════════════════════ -->
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const SENTIMENT = {
  Bullish: { label: '↑ Bullish', border: '#22c55e', bg: 'rgba(34,197,94,.15)', text: 'text-green-400', badge: 'bg-green-500/20 text-green-400 border-green-500/30', bar: '#22c55e' },
  Bearish: { label: '↓ Bearish', border: '#ef4444', bg: 'rgba(239,68,68,.15)', text: 'text-red-400', badge: 'bg-red-500/20 text-red-400 border-red-500/30', bar: '#ef4444' },
  Neutral: { label: '→ Neutral', border: '#f59e0b', bg: 'rgba(245,158,11,.1)', text: 'text-amber-400', badge: 'bg-amber-500/20 text-amber-400 border-amber-500/30', bar: '#f59e0b' },
};
const CATALYST_ICON = { earnings:'📊', analyst_rating:'📈', regulation:'⚖️', product_launch:'🚀', m_and_a:'🤝', management:'👔', litigation:'⚠️', macro:'🌍' };
const MA_COLORS = { ma5: '#f59e0b', ma10: '#3b82f6', ma20: '#a855f7', ma60: '#ec4899' };
const BB_COLOR = '#06b6d4';

// ── State ────────────────────────────────────────────────────────────────────
let isMock = true;
let currentPeriod = '3M';
let currentTicker = 'AAPL';
let currentData = null;          // full API response (cached)
let priceChart = null, volumeChart = null, rsiChart = null, macdChart = null;
let activeOverlays = new Set(['ma5','ma10','ma20']);
let sidebarOpen = true;

// ── Watchlist state ──────────────────────────────────────────────────────────
const WL_KEY = 'stock-insights-watchlist';
let watchlist = JSON.parse(localStorage.getItem(WL_KEY) || '["AAPL","TSLA","NVDA"]');
let wlQuotes = {};  // { symbol: { current_price, change, change_pct, ... } }

function saveWatchlist() { localStorage.setItem(WL_KEY, JSON.stringify(watchlist)); }

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('wl-sidebar').classList.toggle('collapsed', !sidebarOpen);
}

function addCurrentToWatchlist() {
  const t = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (t) addToWatchlist(t);
}

function addFromInput() {
  const inp = document.getElementById('wl-add-input');
  const t = inp.value.trim().toUpperCase();
  if (t) { addToWatchlist(t); inp.value = ''; }
}

function addToWatchlist(ticker) {
  const normalized = normalizeTicker(ticker);
  if (watchlist.includes(normalized)) return;
  watchlist.push(normalized);
  saveWatchlist();
  refreshWatchlist();
}

function removeFromWatchlist(ticker) {
  watchlist = watchlist.filter(t => t !== ticker);
  saveWatchlist();
  renderWatchlist();
}

function normalizeTicker(raw) {
  const t = raw.toUpperCase().trim();
  if (t.includes('.')) return t;
  if (/^\d+$/.test(t)) {
    if (t.length === 4 || t.length === 5) return t + '.TW';
    if (t.length === 6) return (t.startsWith('6') ? t + '.SS' : t + '.SZ');
  }
  return t;
}

async function refreshWatchlist() {
  if (!watchlist.length) { renderWatchlist(); return; }
  const icon = document.getElementById('wl-refresh-icon');
  icon.classList.add('spin');
  try {
    const res = await fetch(`/api/batch-quotes?tickers=${watchlist.join(',')}&mock=${isMock}`);
    if (res.ok) {
      const data = await res.json();
      wlQuotes = {};
      for (const q of data.quotes) { if (!q.error) wlQuotes[q.symbol] = q; }
    }
  } catch (e) { console.warn('Watchlist refresh failed:', e); }
  icon.classList.remove('spin');
  renderWatchlist();
}

function renderWatchlist() {
  const list = document.getElementById('wl-list');
  if (!watchlist.length) {
    list.innerHTML = '<div class="px-3 py-6 text-center text-xs text-slate-500">尚未加入自選股<br>使用 + 按鈕新增</div>';
    return;
  }
  list.innerHTML = watchlist.map(ticker => {
    const q = wlQuotes[ticker];
    const active = ticker === currentTicker ? ' active' : '';
    const price = q ? `$${q.current_price.toFixed(2)}` : '–';
    const change = q ? `${q.change >= 0 ? '+' : ''}${q.change.toFixed(2)}` : '';
    const pct = q ? `${q.change_pct >= 0 ? '+' : ''}${q.change_pct.toFixed(2)}%` : '';
    const color = q ? (q.change >= 0 ? 'text-green-400' : 'text-red-400') : 'text-slate-500';
    const displayTicker = ticker.replace(/\.(TW|SS|SZ)$/, '');
    return `
      <div class="wl-row flex items-center px-3 py-2.5 cursor-pointer${active}"
           onclick="switchToStock('${ticker}')">
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold text-slate-200 truncate">${displayTicker}</div>
          <div class="text-xs ${color} tabular-nums">${change} (${pct})</div>
        </div>
        <div class="text-right shrink-0 mr-2">
          <div class="text-sm font-semibold text-slate-100 tabular-nums">${price}</div>
        </div>
        <button onclick="event.stopPropagation(); removeFromWatchlist('${ticker}')"
          class="p-0.5 rounded hover:bg-red-500/20 transition" title="移除">
          <svg class="w-3.5 h-3.5 text-slate-600 hover:text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>`;
  }).join('');
}

function switchToStock(ticker) {
  currentTicker = ticker;
  document.getElementById('ticker-input').value = ticker.replace(/\.(TW|SS|SZ)$/, (m) => m);
  analyze();
}

// ── Period controls (FIXED: only update charts, not full page) ───────────────
document.getElementById('period-btns').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-p]');
  if (!btn || btn.dataset.p === currentPeriod) return;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = btn.dataset.p;

  // Show inline chart loading (NOT full page loading)
  document.getElementById('chart-loading').classList.remove('hidden');

  try {
    const ticker = document.getElementById('ticker-input').value.trim().toUpperCase();
    const res = await fetch(`/api/stock-chart?ticker=${ticker}&period=${currentPeriod}&mock=${isMock}`);
    if (!res.ok) throw new Error('Failed');
    const data = await res.json();

    // Only update chart data — fundamentals/catalysts/sentiment untouched
    currentData.kline = data.kline;
    currentData.indicators = data.indicators;
    currentData.period = data.period;

    // Only re-render charts
    renderCandlestick(currentData.kline, currentData.indicators);
    renderVolume(currentData.kline);
    renderRSI(currentData.kline, currentData.indicators);
    renderMACD(currentData.kline, currentData.indicators);
  } catch (e) {
    console.error('Period switch failed:', e);
  }

  document.getElementById('chart-loading').classList.add('hidden');
});

// Overlay toggles — pure client-side, no API call
document.getElementById('overlay-chips').addEventListener('click', e => {

// ── UI state helpers ─────────────────────────────────────────────────────────
function showState(state) {
  ['loading','error','dashboard'].forEach(s => {
    const el = document.getElementById(`state-${s}`) || document.getElementById(s);
    if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
  });
  const el = document.getElementById(`state-${state}`) || document.getElementById(state);
  if (el) { el.classList.remove('hidden'); }
}

// ── API (full analyze) ───────────────────────────────────────────────────────
async function analyze() {
  const ticker = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (!ticker) return;
  currentTicker = normalizeTicker(ticker);

  showState('loading');
  try {
    const res = await fetch(`/api/stock-insights?ticker=${ticker}&period=${currentPeriod}&mock=${isMock}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    currentData = await res.json();
    renderDashboard(currentData);
    showState('dashboard');

    // Update this stock's quote in watchlist from the fresh data
    if (currentData.latest_quote && watchlist.includes(currentTicker)) {
      const q = currentData.latest_quote;
      const diff = q.current_price - q.previous_close;
      const pct = q.previous_close ? (diff / q.previous_close) * 100 : 0;
      wlQuotes[currentTicker] = {
        symbol: currentTicker,
        current_price: q.current_price,
        previous_close: q.previous_close,
        change: Math.round(diff * 100) / 100,
        change_pct: Math.round(pct * 100) / 100,
        currency: q.currency || 'USD',
        market_cap: q.market_cap,
        error: null,
      };
    }
    renderWatchlist(); // update active highlight + fresh quote
  } catch (e) {
    document.getElementById('error-msg').textContent = `Error: ${e.message}`;
    showState('error');
  }
}

  const val = score.composite;

  scoreDonut = new Chart(ctx, {
    type: 'doughnut',

        borderWidth: 0,

      }],
    },
    options: {

  // Sub-score bars

    { label: '技術面', score: score.technical?.score ?? 0, weight: score.weights_used?.technical ?? 0 },
    { label: '基本面', score: score.fundamental?.score ?? 0, weight: score.weights_used?.fundamental ?? 0 },
    { label: '情緒面', score: score.sentiment?.score ?? 0, weight: score.weights_used?.sentiment ?? 0, available: score.sentiment?.available },
  ];
  document.getElementById('sub-scores').innerHTML = subs.map(s => {
    const pct = s.score;
    const barColor = pct >= 61 ? '#22c55e' : pct >= 41 ? '#f59e0b' : '#ef4444';
    const weightPct = Math.round((s.weight || 0) * 100);
    const unavail = s.available === false ? ' <span class="text-slate-600">(不可用)</span>' : '';
    return `
      <div>
        <div class="flex justify-between items-center mb-1">

          <span class="text-xs font-bold tabular-nums" style="color:${barColor}">${pct}</span>
        </div>

// ── Render: candlestick + overlays ───────────────────────────────────────────
const CandlestickPlugin = {
  id: 'candlestick',
  afterDatasetsDraw(chart) {
    const { ctx, scales: { x, y } } = chart;
    const klines = chart._klines;
    if (!klines) return;
    const meta = chart.getDatasetMeta(0);
    meta.data.forEach((bar, i) => {
      const k = klines[i]; if (!k || bar.x == null) return;
      const xc = bar.x;
      const bull = k.close >= k.open;
      const color = bull ? '#22c55e' : '#ef4444';
      const hw = Math.max(3, Math.min(7, Math.round(chart.width / klines.length * 0.3)));
      ctx.save();
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.moveTo(xc, y.getPixelForValue(k.high)); ctx.lineTo(xc, y.getPixelForValue(k.low)); ctx.stroke();
      const openY = y.getPixelForValue(k.open), closeY = y.getPixelForValue(k.close);
      const by = Math.min(openY, closeY), bh = Math.max(Math.abs(openY - closeY), 2);
      ctx.fillStyle = bull ? 'rgba(34,197,94,.75)' : 'rgba(239,68,68,.9)';
      ctx.fillRect(xc - hw, by, hw * 2, bh);
      ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(xc - hw, by, hw * 2, bh);
      ctx.restore();
    });
  }
};

function thinLabels(klines) {
  return klines.map((k, i) => {
    if (klines.length > 120) return i % 20 === 0 ? k.date.slice(5) : '';
    if (klines.length > 60)  return i % 10 === 0 ? k.date.slice(5) : '';
    if (klines.length > 30)  return i % 5  === 0 ? k.date.slice(5) : '';
    return k.date.slice(5);
  });
}

function renderCandlestick(klines, indicators) {
  if (priceChart) priceChart.destroy();
  const ctx = document.getElementById('price-chart').getContext('2d');
  const lo = Math.min(...klines.map(k => k.low)), hi = Math.max(...klines.map(k => k.high));
  const pad = (hi - lo) * 0.12;
  const datasets = [{ data: klines.map(k => [k.low, k.high]), backgroundColor: 'transparent', borderColor: 'transparent' }];
  if (indicators?.ma) {
    for (const [key, color] of Object.entries(MA_COLORS)) {
      if (activeOverlays.has(key) && indicators.ma[key])
        datasets.push({ type:'line', label:key.toUpperCase(), data:indicators.ma[key], borderColor:color, borderWidth:1.5, pointRadius:0, tension:0.3, spanGaps:true });
    }
  }
  if (activeOverlays.has('bb') && indicators?.bollinger) {
    datasets.push({ type:'line', label:'BB Upper', data:indicators.bollinger.upper, borderColor:BB_COLOR, borderWidth:1, borderDash:[4,3], pointRadius:0, tension:0.3, spanGaps:true, fill:false });
    datasets.push({ type:'line', label:'BB Lower', data:indicators.bollinger.lower, borderColor:BB_COLOR, borderWidth:1, borderDash:[4,3], pointRadius:0, tension:0.3, spanGaps:true, fill:'-1', backgroundColor:'rgba(6,182,212,.06)' });
  }
  priceChart = new Chart(ctx, {
    type:'bar', data:{ labels:thinLabels(klines), datasets },
    options:{
      responsive:true, maintainAspectRatio:false, animation:{duration:300},
      scales:{
        x:{grid:{color:'#1e293b'},ticks:{color:'#64748b',font:{size:10},maxRotation:0},border:{color:'#334155'}},
        y:{position:'right',min:lo-pad,max:hi+pad,grid:{color:'#1e293b80'},ticks:{color:'#64748b',font:{size:11},callback:v=>'$'+v.toFixed(1)},border:{color:'#334155'}},
      },
      plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>klines[items[0].dataIndex]?.date||'',label:item=>{if(item.datasetIndex===0){const k=klines[item.dataIndex];return[`  Open  $${k.open.toFixed(2)}`,`  High  $${k.high.toFixed(2)}`,`  Low   $${k.low.toFixed(2)}`,`  Close $${k.close.toFixed(2)}`]}return`  ${item.dataset.label}: $${item.raw?.toFixed(2)??'–'}`}},backgroundColor:'#0f172a',borderColor:'#334155',borderWidth:1,titleColor:'#f1f5f9',bodyColor:'#94a3b8',padding:10}},
    },
    plugins:[CandlestickPlugin],
  });
  priceChart._klines = klines;
}

function renderVolume(klines) {

function renderRSI(klines, indicators) {

// ── Utilities ────────────────────────────────────────────────────────────────
function fmtCap(n){if(!n)return'–';if(n>=1e12)return`$${(n/1e12).toFixed(2)}T`;if(n>=1e9)return`$${(n/1e9).toFixed(2)}B`;if(n>=1e6)return`$${(n/1e6).toFixed(0)}M`;return`$${n.toLocaleString()}`}
function fmtVol(v){if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return String(v)}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
